name: Academy movement smoke checks
on:
  push:
    paths:
      - 'live-coach.html'
      - 'pose-lab.html'
      - 'movement-assessment-studio.html'
      - 'assessment-history.html'
      - 'movement-bridge.html'
      - 'scripts/academy-smoke-check.cjs'
      - '.github/workflows/academy-smoke.yml'
  pull_request:
    paths:
      - 'live-coach.html'
      - 'pose-lab.html'
      - 'movement-assessment-studio.html'
      - 'assessment-history.html'
      - 'movement-bridge.html'
      - 'scripts/academy-smoke-check.cjs'
      - '.github/workflows/academy-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse movement pages and check assessment contracts
        run: node scripts/academy-smoke-check.cjs

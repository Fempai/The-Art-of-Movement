name: Academy mobile browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aom-http.log 2>&1 &
      - name: Run Android-size browser tests
        run: npx playwright test tests/mobile-academy.spec.js --reporter=line --workers=1

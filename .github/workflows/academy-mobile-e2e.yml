name: Academy desktop and mobile browser regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aom-http.log 2>&1 &
      - name: Run desktop and Android-size browser regression tests
        run: npx playwright test tests/mobile-academy.spec.js tests/desktop-academy.spec.js --reporter=line,html --workers=1 --trace=retain-on-failure
      - name: Upload visual and performance test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-avatar-visual-performance
          path: |
            test-results/**/avatar-*.png
            test-results/**/avatar-desktop-performance.json
            test-results/**/avatar-performance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-playwright-failure-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/aom-http.log
          retention-days: 7

name: Published Academy smoke check
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-site:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public Pages endpoints after deployment
        env:
          AOM_SITE: https://fempai.github.io/The-Art-of-Movement
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          base=os.environ['AOM_SITE']
          paths={
            '/': ('The Art of Movement',),
            '/weekly-studio.html?week=3': ('Weekly Studio', 'progress'),
            '/studio-record.html': ('Studio Record',),
            '/academy-backup.html': ('Local Academy backup', 'Restore local records'),
            '/conservatory-course-reader.html': ('html',),
          }
          failures=[]
          for path, expected in paths.items():
              url=base+path
              error=None
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'AOM-Published-Smoke/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          body=response.read(2_000_000).decode('utf-8','replace')
                          status=response.status
                      if status!=200:
                          raise ValueError(f'HTTP {status}')
                      if not all(marker.lower() in body.lower() for marker in expected):
                          raise ValueError('Missing expected page content: '+', '.join(x for x in expected if x.lower() not in body.lower()))
                      print(f'PASS {url}: HTTP {status}, expected content present')
                      error=None
                      break
                  except (OSError, ValueError) as exc:
                      error=str(exc)
                      print(f'Attempt {attempt+1}/8 failed for {url}: {error}',flush=True)
                      if attempt<7: time.sleep(12)
              if error: failures.append((url,error))
          if failures:
              for url,error in failures: print(f'::error title=Published Academy smoke check::{url}: {error}')
              raise SystemExit(1)
          print('All five published Academy endpoints responded with expected HTML.')
          PY

name: Academy lesson and quiz verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all 97 lesson quizzes
        run: node tests/audit-all-quizzes.cjs
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run reader and quiz browser regressions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/conservatory-course-reader.html > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=playwright-results.xml npx playwright test tests/quiz-browser.spec.cjs --browser=chromium --workers=1 --reporter=github,line,junit --trace=retain-on-failure --screenshot=only-on-failure
      - name: Summarize browser test results
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='playwright-results.xml';
          const out=process.env.GITHUB_STEP_SUMMARY;
          if(!fs.existsSync(file)){
            fs.appendFileSync(out,'## Academy browser verification\\nNo Playwright JUnit report was produced. Check earlier workflow steps.\\n');
            process.exit(0);
          }
          const xml=fs.readFileSync(file,'utf8');
          const suites=[...xml.matchAll(/<testsuite\\b[^>]*>/g)].map(x=>x[0]);
          const get=(tag,key)=>Number((tag.match(new RegExp(key+'="(\\\\d+)"'))||[])[1]||0);
          const totals=suites.reduce((acc,tag)=>{for(const k of ['tests','failures','errors','skipped'])acc[k]+=get(tag,k);return acc},{tests:0,failures:0,errors:0,skipped:0});
          const failed=[...xml.matchAll(/<testcase\\b[^>]*name="([^"]+)"[^>]*>[\\s\\S]*?<failure\\b/g)].map(x=>x[1]);
          const lines=['## Academy browser verification','Tests: '+totals.tests+' | Failures: '+totals.failures+' | Errors: '+totals.errors+' | Skipped: '+totals.skipped];
          if(failed.length)lines.push('### Failed cases',...failed.map(x=>'- '+x));
          fs.appendFileSync(out,lines.join('\\n')+'\\n');
          NODE
      - name: Upload browser test report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
            playwright-results.xml
          if-no-files-found: ignore

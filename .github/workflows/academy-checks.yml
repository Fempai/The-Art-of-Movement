name: Academy static regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Academy scripts and privacy-sensitive movement contracts
        run: python scripts/check-academy.py
      - name: Validate assessment, camera and cloud contracts
        run: node scripts/academy-smoke-check.cjs
      - name: Verify Pose Lab evidence-window behavior
        run: node scripts/test-pose-evidence.cjs
      - name: Verify local reference motion comparison
        run: node scripts/test-motion-comparison.cjs
      - name: Verify 3D avatar projections and landmark safeguards
        run: node scripts/test-pose-avatar.cjs
      - name: Verify coach mode-specific tracking gates
        run: node scripts/test-coach-tracking.cjs
      - name: Verify technique calibration evidence gates and grading abstention
        run: node scripts/test-technique-calibration.cjs
      - name: Verify animated character retargeting and rig safety
        run: node scripts/test-character-retarget.cjs
      - name: Verify GPU skinned avatar rig and input safeguards
        run: node scripts/test-skinned-avatar.mjs
      - name: Verify stationary-foot contact stabilizer
        run: node scripts/test-foot-contact.mjs
      - name: Verify licensed humanoid rig mapping safeguards
        run: node scripts/test-humanoid-retarget.mjs
      - name: Verify bounded movement interpolation and joint stability
        run: node scripts/test-pose-interpolation.mjs
      - name: Verify avatar customization presets and input bounds
        run: node scripts/test-avatar-customization.mjs
      - name: Verify bounded leg IK and planted-foot motion
        run: node scripts/test-leg-ik.mjs
      - name: Verify Academy and Life OS local integration contracts
        run: node scripts/test-academy-integration.mjs
      - name: Install Three.js for numerical bind-pose verification
        run: npm install --no-save three@0.170.0
      - name: Verify world-space and parent-local skeleton rotations numerically
        run: node scripts/test-humanoid-geometry.mjs

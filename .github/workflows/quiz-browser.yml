name: Quiz browser regression
on:
  push:
    paths:
      - 'conservatory-course-reader.html'
      - 'conservatory-progress.html'
      - 'curriculum/COURSE_LESSONS_AND_SOURCES.json'
      - 'tests/quiz-browser.spec.cjs'
      - 'tests/audit-all-quizzes.cjs'
      - 'curriculum/final-lessons/**'
      - '.github/workflows/quiz-browser.yml'
  workflow_dispatch:
jobs:
  quiz-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all 80 lesson quizzes
        run: node tests/audit-all-quizzes.cjs
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aom-http.log 2>&1 &
      - name: Wait for course reader server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/conservatory-course-reader.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aom-http.log
          exit 1
      - name: Run grading and progress browser regressions
        run: npx playwright test tests/quiz-browser.spec.cjs --browser chromium --reporter=line --trace=retain-on-failure --screenshot=only-on-failure --workers=1
      - name: Publish quiz regression summary
        if: always()
        run: |
          echo '## Quiz browser regression' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the grading and progress test step for pass/fail evidence. Failed-run diagnostics are uploaded below.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
            /tmp/aom-http.log
          if-no-files-found: ignore

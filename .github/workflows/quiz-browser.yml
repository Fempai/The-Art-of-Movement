name: Quiz browser regression
on:
  push:
    paths:
      - 'conservatory-course-reader.html'
      - 'conservatory-progress.html'
      - 'curriculum/COURSE_LESSONS_AND_SOURCES.json'
      - 'tests/quiz-browser.spec.cjs'
      - 'tests/audit-all-quizzes.cjs'
      - 'curriculum/final-lessons/**'
      - '.github/workflows/quiz-browser.yml'
  workflow_dispatch:
concurrency:
  group: quiz-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quiz-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser test and audit script syntax
        run: |
          node --check tests/quiz-browser.spec.cjs
          node --check tests/audit-all-quizzes.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('conservatory-course-reader.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if(!scripts.length)throw Error('Course Reader has no inline script');
          scripts.forEach((match,index)=>new vm.Script(match[1],{filename:'conservatory-course-reader.html:inline-script-'+(index+1)}));
          console.log('PASS: Course Reader inline JavaScript parses');
          NODE
      - name: Verify repository lesson inventory
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const courses=['MOV101','DNC101','CON101','HIP101','MUS101','CMP101','HIS101','LAB101','STG101','FLE101','LMA201','PER201','RES501','CMP502','SCI503','EST504','SIT505','PRO701','PRO702','PRO703'];
          const expected=new Set(courses.flatMap(course=>Array.from({length:4},(_,i)=>`${course}-${String(i+1).padStart(2,'0')}.md`)));
          const actual=fs.readdirSync('curriculum/final-lessons').filter(name=>/^[A-Z]{3}[0-9]{3}-0[1-4]\.md$/.test(name));
          const missing=[...expected].filter(name=>!actual.includes(name));
          const unexpected=actual.filter(name=>!expected.has(name));
          if(missing.length||unexpected.length){console.error('Lesson inventory mismatch:',{missing,unexpected});process.exit(1)}
          console.log('PASS: all 80 expected lesson IDs are present with no unexpected course IDs.');
          NODE
      - name: Audit all 80 lesson quizzes
        shell: bash
        run: |
          set -o pipefail
          node tests/audit-all-quizzes.cjs 2>&1 | tee /tmp/aom-quiz-audit.log
      - name: Include curriculum audit in run summary
        if: always()
        run: |
          echo '## Curriculum quiz audit' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/aom-quiz-audit.log ]; then
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/aom-quiz-audit.log >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit did not execute; inspect the workflow steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aom-http.log 2>&1 &
      - name: Wait for course reader server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/conservatory-course-reader.html > /dev/null && curl --fail --silent http://127.0.0.1:8765/conservatory-progress.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aom-http.log
          exit 1
      - name: Run grading and progress browser regressions
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/quiz-results.json
        run: |
          mkdir -p test-results
          npx playwright test tests/quiz-browser.spec.cjs --browser chromium --reporter=line,json --trace=retain-on-failure --workers=1 --output=test-results
      - name: Publish quiz regression summary
        if: always()
        run: |
          echo '## Quiz browser regression' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/quiz-results.json ]; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("test-results/quiz-results.json","utf8"));const s=r.stats||{};fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Passed: "+(s.expected??"unknown")+"; failed: "+(s.unexpected??"unknown")+"; flaky: "+(s.flaky??"unknown")+"; skipped: "+(s.skipped??"unknown")+String.fromCharCode(10))'
          else
            echo 'No JSON test report was generated; inspect earlier workflow steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Full test evidence is retained in the workflow artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-playwright-results
          path: test-results/
          if-no-files-found: warn
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
            /tmp/aom-http.log
          if-no-files-found: ignore

name: Instructional coverage triage
on:
  push:
    paths:
      - 'curriculum/final-lessons/**'
      - 'curriculum/BEL101-VIDEO-SOURCES.json'
      - 'tests/audit-instructional-coverage.cjs'
      - 'tests/audit-bellydance-feedback.cjs'
      - 'tests/audit-all-quizzes.cjs'
      - 'tests/audit-quiz-ambiguity-regressions.cjs'
      - '.github/workflows/instructional-coverage.yml'
  pull_request:
    paths:
      - 'curriculum/final-lessons/**'
      - 'curriculum/BEL101-VIDEO-SOURCES.json'
      - 'tests/audit-instructional-coverage.cjs'
      - 'tests/audit-bellydance-feedback.cjs'
      - 'tests/audit-all-quizzes.cjs'
      - 'tests/audit-quiz-ambiguity-regressions.cjs'
      - '.github/workflows/instructional-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check triage script syntax
        run: node --check tests/audit-instructional-coverage.cjs
      - name: Check BEL101 feedback regression script syntax
        run: node --check tests/audit-bellydance-feedback.cjs
      - name: Check all-lesson quiz audit script syntax
        run: node --check tests/audit-all-quizzes.cjs
      - name: Check ambiguity regression script syntax
        run: node --check tests/audit-quiz-ambiguity-regressions.cjs
      - name: Verify known ambiguous questions stay corrected
        shell: bash
        run: |
          set -o pipefail
          node tests/audit-quiz-ambiguity-regressions.cjs 2>&1 | tee quiz-ambiguity-regressions.log
      - name: Verify 97-lesson quiz compatibility
        shell: bash
        run: |
          set -o pipefail
          node tests/audit-all-quizzes.cjs 2>&1 | tee all-quizzes-audit.log
      - name: Check all BEL101 lesson answer explanations
        shell: bash
        run: |
          set -o pipefail
          node tests/audit-bellydance-feedback.cjs 2>&1 | tee bellydance-feedback-audit.log
      - name: Run all-lesson instructional coverage triage
        shell: bash
        run: |
          set -o pipefail
          AOM_AUDIT_JSON=1 node tests/audit-instructional-coverage.cjs 2>&1 | tee instructional-coverage.log
      - name: Publish triage summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Instructional coverage triage'
            echo 'This is a text-coverage screen, **not** a determination of teaching quality, movement correctness, or quiz-answer validity.'
            echo 'Review all flags and manually evaluate the nine instructional validation dimensions.'
            echo 'Full machine-readable coverage results and separate quiz audit logs are available in the artifact.'
            for audit in all-quizzes-audit.log bellydance-feedback-audit.log quiz-ambiguity-regressions.log; do
              if [ -f "$audit" ]; then
                echo "### $audit"
                echo '```text'
                cat "$audit"
                echo '```'
              else
                echo "### $audit"
                echo 'Audit log unavailable; inspect the corresponding workflow step.'
              fi
            done
            if [ -f instructional-coverage.log ]; then
              echo '### Initial output'
              echo '```text'
              head -n 2 instructional-coverage.log
              echo '```'
            else
              echo 'Triage did not produce output.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instructional-coverage-triage
          path: |
            instructional-coverage.log
            all-quizzes-audit.log
            bellydance-feedback-audit.log
            quiz-ambiguity-regressions.log
          if-no-files-found: warn

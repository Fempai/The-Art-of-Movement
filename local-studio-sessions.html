<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Studio Sessions · Art of Movement</title><link rel="stylesheet" href="assets/academy-editorial.css"><style>main{max-width:820px;margin:auto;padding:24px 16px 80px}section{background:#fffdf9;padding:20px;border:1px solid #d9c8ba;margin:18px 0}button,input{font:inherit;padding:11px;margin:5px;max-width:100%}button{background:#502c3e;color:white;border:0;cursor:pointer;min-height:44px}li{padding:9px;border-bottom:1px solid #ddd}a{color:#502c3e}</style></head><body><main><h1>Local Studio Sessions</h1><p>Practice notes saved by the Avatar Studio and Motion Comparison are kept in this browser only. They are not shared Life OS journal entries, technique grades, or cloud backups.</p><p><a href="skinned-avatar-studio.html">Avatar Studio</a> · <a href="motion-comparison.html">Motion Comparison</a> · <a href="movement-bridge.html">Private Life OS bridge</a></p><section><h2>Saved session notes</h2><p id="status" role="status"></p><ol id="sessions"></ol><button id="export" type="button">Export local session notes</button><label>Restore notes from JSON <input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button">Clear saved notes</button></section></main><script src="assets/academy-integration.js"></script><script src="assets/academy-navigation.js" defer></script><script>
const $=id=>document.getElementById(id);
function render(){const rows=AOMIntegration.sessions(localStorage);$('sessions').replaceChildren();for(const r of rows.slice().reverse()){const li=document.createElement('li');li.textContent=(r.created||'Undated')+' · '+r.type+' · '+r.note+' · '+Math.round(r.seconds||0)+' units';$('sessions').append(li)}$('status').textContent=rows.length+' local session note(s). Export a backup before clearing browser data.'}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'aom-studio-sessions-v1',records:AOMIntegration.sessions(localStorage)},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='academy-local-studio-sessions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async()=>{try{const f=$('import').files?.[0];if(!f)return;if(f.size>100000)throw Error('File exceeds 100 KB');const data=JSON.parse(await f.text());if(data.format!=='aom-studio-sessions-v1'||!Array.isArray(data.records)||data.records.length>100)throw Error('Unsupported session backup');const map=new Map(AOMIntegration.sessions(localStorage).map(x=>[x.id,x]));for(const x of data.records){if(!x||typeof x.id!=='string'||x.id.length>80||!['avatar','comparison','practice'].includes(x.type)||typeof x.note!=='string'||x.note.length>240||!Number.isFinite(x.seconds)||x.seconds<0||x.seconds>7200||!Number.isFinite(Date.parse(x.created)))throw Error('Invalid record');if(!map.has(x.id))map.set(x.id,{id:x.id,type:x.type,note:x.note,seconds:x.seconds,created:x.created,source:'Academy local session (not a technique grade)'})}localStorage.setItem(AOMIntegration.PROGRESS,JSON.stringify([...map.values()].slice(-100)));render();$('status').textContent='Imported session notes without overwriting existing matching IDs.'}catch(e){$('status').textContent='Import rejected: '+e.message}};
$('clear').onclick=()=>{if(!confirm('Delete local session notes from this browser? This does not affect your private Life OS records.'))return;localStorage.removeItem(AOMIntegration.PROGRESS);render()};render();
</script></body></html>

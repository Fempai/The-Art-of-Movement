<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twerk Knowledge Checks · Movement</title><style>*{box-sizing:border-box}body{margin:0;background:#f6eeea;color:#32252b;font:16px/1.55 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:22px}h1{font:normal clamp(2rem,5vw,3.2rem) Georgia,serif}fieldset{border:1px solid #d8bfc8;background:white;border-radius:10px;padding:18px;margin:15px 0}legend{font-weight:700;padding:0 5px}label{display:block;padding:7px}button,select{font:inherit;padding:9px;margin:8px 5px 8px 0}button{background:#703b53;color:white;border:0;border-radius:6px;cursor:pointer}.note{background:#eee0e3;padding:14px;border-radius:8px}#result{font-weight:bold}a{color:#703b53}input{accent-color:#703b53}@media(max-width:600px){main{padding:14px}fieldset{padding:12px}}</style></head><body><main><a href="./twerk-foundations.html">← Twerk pathway</a><h1>Interactive knowledge checks</h1><p class="note">Four questions per lesson. Choose a lesson, answer, and submit for feedback. Results are saved on this device only; they are not an authenticated Academy record or proof of physical proficiency. No outside reviewer is required.</p><label for="lesson">Lesson</label><select id="lesson" aria-label="Choose lesson"></select><button id="load">Load assessment</button><p id="status" role="status" aria-live="polite"></p><form id="quiz" hidden></form><p id="result" role="status" aria-live="polite"></p><button id="clear" type="button">Clear this device's quiz history</button><p id="history"></p></main><script>
const codes=['TWK101','TWK201','TWK301','TWK401'],select=document.getElementById('lesson'),quiz=document.getElementById('quiz'),status=document.getElementById('status'),result=document.getElementById('result'),history=document.getElementById('history'),storage='aom_twerk_quiz_attempts_v1';let current=[],active='',request=0;
for(const code of codes)for(let i=1;i<=8;i++){const id=code+'-'+String(i).padStart(2,'0'),o=document.createElement('option');o.value=id;o.textContent=id;select.append(o)}
function attempts(){try{const v=JSON.parse(localStorage.getItem(storage)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch{return {}}}
function showHistory(){const a=attempts();history.textContent=Object.keys(a).length+' lesson result(s) saved on this device.'}
function parse(text){const part=text.split('## Four-question knowledge check')[1]?.split(/\n## /)[0]||'';const blocks=part.split(/(?=\*\*[1-4]\.\s)/).filter(x=>/^\*\*[1-4]\.\s/.test(x));return blocks.map(b=>{const stem=b.match(/^\*\*([1-4])\.\s*(.*?)\*\*/)?.[2],key=b.match(/\*\*Key:\s*([A-D])\./)?.[1],options=[...b.matchAll(/^([A-D])\.\s*(.+)$/gm)].map(m=>({letter:m[1],text:m[2]}));return{stem,key,options}})}
async function load(){const id=select.value,token=++request;active='';current=[];quiz.hidden=true;quiz.replaceChildren();result.textContent='';status.textContent='Loading '+id+'…';try{const url='https://raw.githubusercontent.com/Fempai/The-Art-of-Movement/main/curriculum/final-lessons/'+id+'.md';const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('Lesson unavailable (HTTP '+response.status+')');const parsed=parse(await response.text());if(token!==request)return;if(parsed.length!==4||parsed.some(q=>!q.stem||!q.key||q.options.length!==4||new Set(q.options.map(o=>o.letter)).size!==4))throw Error('Assessment format needs correction; no score recorded');current=parsed;active=id;parsed.forEach((q,i)=>{const fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q.stem;fs.append(legend);q.options.forEach(o=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=o.letter;input.required=true;label.append(input,document.createTextNode(' '+o.letter+'. '+o.text));fs.append(label)});quiz.append(fs)});const btn=document.createElement('button');btn.type='submit';btn.textContent='Check answers';quiz.append(btn);quiz.hidden=false;status.textContent='Four questions loaded for '+id}catch(e){if(token!==request)return;status.textContent=String(e.message||e)}}
quiz.addEventListener('submit',e=>{e.preventDefault();if(!active||current.length!==4)return;let score=0;const feedback=[];current.forEach((q,i)=>{const choice=quiz.querySelector('input[name="q'+i+'"]:checked')?.value;if(choice===q.key)score++;feedback.push('Q'+(i+1)+': '+(choice===q.key?'Correct':'Correct answer '+q.key))});result.textContent=active+': '+score+'/4. '+feedback.join(' · ');const a=attempts();a[active]={score,total:4,completedAt:new Date().toISOString()};try{localStorage.setItem(storage,JSON.stringify(a))}catch{status.textContent='Browser storage unavailable; result not saved'}showHistory()});
document.getElementById('load').addEventListener('click',load);document.getElementById('clear').addEventListener('click',()=>{if(!confirm('Clear all locally saved twerk quiz scores on this device?'))return;try{localStorage.removeItem(storage)}catch{}showHistory()});showHistory();load();
</script></body></html>
